<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceleration graphs (50 s)</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:10px;background:#111827;color:#f3f4f6;font:12px Arial,sans-serif}.widget{width:100%;max-width:440px;margin:0 auto}.control{display:grid;grid-template-columns:132px 1fr 58px;align-items:center;gap:8px;margin:0 0 7px}.control output{text-align:right;font-variant-numeric:tabular-nums;color:#a5e1ff}input{width:100%;accent-color:#60a5fa;cursor:pointer}.chart{display:grid;grid-template-columns:100px minmax(0,1fr);align-items:center;gap:5px;margin-top:5px}.chart label{font-size:11px;line-height:1.3}canvas{display:block;width:100%;height:95px;background:#172236;border-radius:5px} @media(max-width:370px){.control{grid-template-columns:105px 1fr 50px;gap:5px}.chart{grid-template-columns:77px 1fr}}
</style></head><body><main class="widget">
<div class="control"><label for="v">Initial velocity</label><input id="v" type="range" min="-6" max="10" step="0.5" value="0"><output id="vo">0 m/s</output></div>
<div class="control"><label for="a">Acceleration</label><input id="a" type="range" min="-10" max="10" step="0.25" value="1"><output id="ao">1 m/s²</output></div>
<div class="chart"><label>Position<br>(m)</label><canvas id="position"></canvas></div>
<div class="chart"><label>Velocity<br>(m/s)</label><canvas id="velocity"></canvas></div>
<div class="chart"><label>Acceleration<br>(m/s²)</label><canvas id="acceleration"></canvas></div>
</main><script>
const DURATION=50;
const v=document.getElementById('v'),a=document.getElementById('a');
function plot(id,fn,color){const c=document.getElementById(id),dpr=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;const pixelW=Math.round(w*dpr),pixelH=Math.round(h*dpr);
// Resetting canvas dimensions on every slider input clears it and can cause flashing.
if(c.width!==pixelW||c.height!==pixelH){c.width=pixelW;c.height=pixelH}
const ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);const L=34,R=8,T=10,B=19,W=w-L-R,H=h-T-B;const ys=Array.from({length:501},(_,i)=>fn(i*DURATION/500));
const lo=Math.min(0,...ys),hi=Math.max(0,...ys),pad=Math.max((hi-lo)*.12,.5),min=lo-pad,max=hi+pad;const X=x=>L+W*x/DURATION,Y=y=>T+H*(max-y)/(max-min);ctx.strokeStyle='#34435c';ctx.lineWidth=1;ctx.font='10px Arial';ctx.fillStyle='#aebed2';ctx.textAlign='right';for(let i=0;i<=2;i++){let yy=T+H*i/2;ctx.beginPath();ctx.moveTo(L,yy);ctx.lineTo(w-R,yy);ctx.stroke();ctx.fillText((max-(max-min)*i/2).toFixed(1),L-5,yy+3)}ctx.textAlign='center';for(let i=0;i<=4;i++){let xx=X(i*DURATION/4);ctx.beginPath();ctx.moveTo(xx,T);ctx.lineTo(xx,T+H);ctx.stroke();ctx.fillText(String(i*DURATION/4),xx,h-5)}ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=2;for(let i=0;i<=500;i++){let x=i*DURATION/500,y=fn(x);i?ctx.lineTo(X(x),Y(y)):ctx.moveTo(X(x),Y(y))}ctx.stroke()}
function update(){let vi=+v.value,ac=+a.value;document.getElementById('vo').textContent=vi+' m/s';document.getElementById('ao').textContent=ac+' m/s²';plot('position',x=>vi*x+.5*ac*x*x,'#60a5fa');plot('velocity',x=>vi+ac*x,'#34d399');plot('acceleration',x=>ac,'#fbbf24')};[v,a].forEach(el=>el.addEventListener('input',update));window.addEventListener('resize',update);update();
</script></body></html>
